name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet Go code
        run: go vet ./...

      - name: Build Go server
        run: go build -o /tmp/openquiz ./cmd/openquiz

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      - name: Check frontend types
        run: npm run check
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/
          if-no-files-found: error

  application:
    name: Embedded application build
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/

      - name: Build application with frontend assets
        run: go build -o /tmp/openquiz ./cmd/openquiz
