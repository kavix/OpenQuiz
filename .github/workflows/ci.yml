name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Go code
        run: go vet ./...

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      - name: Check frontend
        run: npm run check
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Build application
        run: go build -o /tmp/openquiz ./cmd/openquiz
